<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trucker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app" id="app">
        <!-- Header -->
        <header class="header">
            <h1>Trucker</h1>
            <button class="close" id="closeBtn">×</button>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <button class="nav-item active" data-tab="jobs">Jobs</button>
            <button class="nav-item" data-tab="rental">Rental</button>
        </nav>

        <!-- Content -->
        <main class="main">
            <!-- Jobs Tab -->
            <section class="tab active" id="jobs">
                <!-- Player Card -->
                <div class="card">
                    <div class="player">
                        <div class="player-info">
                            <h2 id="playerName">Driver</h2>
                            <span class="level" id="playerLevel">Level 1</span>
                        </div>
                        <div class="stats">
                            <div class="stat">
                                <span class="value" id="totalDeliveries">0</span>
                                <span class="label">Jobs</span>
                            </div>
                            <div class="stat">
                                <span class="value" id="totalEarnings">$0</span>
                                <span class="label">Earned</span>
                            </div>
                        </div>
                    </div>
                    
                    <!-- EXP Bar -->
                    <div class="exp">
                        <div class="exp-info">
                            <span>Experience</span>
                            <span id="expText">0 / 100</span>
                        </div>
                        <div class="exp-bar">
                            <div class="exp-fill" id="expFill"></div>
                        </div>
                    </div>
                </div>

                <!-- Active Job -->
                <div class="card active-job" id="activeJob" style="display: none;">
                    <div class="job-header">
                        <h3>Current Job</h3>
                        <button class="btn-small" id="cancelJob">Cancel</button>
                    </div>
                    <div class="job-status" id="jobStatus"></div>
                </div>

                <!-- Available Jobs -->
                <div class="card">
                    <h3>Available Jobs</h3>
                    <div class="jobs" id="jobsList"></div>
                </div>
            </section>

            <!-- Rental Tab -->
            <section class="tab" id="rental">
                <div class="card">
                    <h3>Vehicle Rental</h3>
                    <p class="subtitle">All rentals are free</p>
                    
                    <!-- Vehicle Display -->
                    <div class="vehicle">
                        <div class="vehicle-nav">
                            <button class="nav-arrow" id="prevVehicle">‹</button>
                            <span class="counter">
                                <span id="currentVehicle">1</span>/<span id="totalVehicles">3</span>
                            </span>
                            <button class="nav-arrow" id="nextVehicle">›</button>
                        </div>
                        
                        <div class="vehicle-card">
                            <div class="vehicle-image">
                                <img id="vehicleImage" src="https://via.placeholder.com/300x120/f8fafc/64748b?text=Vehicle" alt="Vehicle">
                            </div>
                            <div class="vehicle-info">
                                <h4 id="vehicleName">Phantom</h4>
                                <p id="vehicleDesc">Heavy duty truck</p>
                                <div class="tags">
                                    <span class="tag" id="vehicleType">Trailer</span>
                                    <span class="tag" id="vehicleDiff">Hard</span>
                                    <span class="tag free">Free</span>
                                </div>
                            </div>
                        </div>
                        
                        <button class="btn-primary" id="rentBtn">Rent Vehicle</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
