<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trucker Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background overlay -->
    <div class="overlay" id="overlay" style="display: none;"></div>
    
    <!-- Main dashboard -->
    <div class="dashboard" id="dashboard" style="display: none;">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                        <path d="M3 17h2l.4-1.6c.2-.8.9-1.4 1.7-1.4h9.8c.8 0 1.5.6 1.7 1.4L19 17h2v2h-2.5l-.5-2H6l-.5 2H3v-2z" fill="currentColor"/>
                        <path d="M7 19a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM17 19a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" fill="currentColor"/>
                        <path d="M5 6V4h14v2l2 6H3l2-6z" fill="currentColor"/>
                    </svg>
                    <h1>Trucker Dashboard</h1>
                </div>
            </div>
            <button class="close-btn" id="closeBtn">×</button>
        </div>

        <!-- Player info -->
        <div class="player-card">
            <div class="player-info">
                <div class="player-details">
                    <h2 id="playerName">Driver Name</h2>
                    <div class="player-meta">
                        <span class="level-badge" id="playerLevel">Level 1</span>
                        <span class="tier-badge" id="playerTier">Rookie</span>
                    </div>
                </div>
                <div class="player-stats">
                    <div class="stat">
                        <span class="stat-value" id="totalDeliveries">0</span>
                        <span class="stat-label">Deliveries</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="totalEarnings">$0</span>
                        <span class="stat-label">Earned</span>
                    </div>
                </div>
            </div>
            
            <!-- EXP Bar -->
            <div class="exp-section">
                <div class="exp-info">
                    <span>Experience</span>
                    <span id="expText">0 / 100 XP</span>
                </div>
                <div class="exp-bar">
                    <div class="exp-fill" id="expFill"></div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="jobs" id="jobsTab">Available Jobs</button>
            <button class="nav-tab" data-tab="rental" id="rentalTab">Vehicle Rental</button>
            <button class="nav-tab" data-tab="delivery" id="deliveryTab" style="display: none;">Active Delivery</button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Jobs Tab -->
            <div class="tab-content active" id="jobsContent">
                <div class="section-title">Choose Your Job</div>
                <div class="jobs-grid" id="jobsList">
                    <!-- Jobs will be populated here -->
                </div>
            </div>

            <!-- Rental Tab -->
            <div class="tab-content" id="rentalContent">
                <div class="section-title">Vehicle Rental</div>
                
                <!-- Vehicle Carousel -->
                <div class="vehicle-showcase">
                    <div class="carousel-nav">
                        <button class="carousel-btn" id="prevVehicle">‹</button>
                        <div class="vehicle-counter">
                            <span id="currentVehicle">1</span> / <span id="totalVehicles">3</span>
                        </div>
                        <button class="carousel-btn" id="nextVehicle">›</button>
                    </div>
                    
                    <div class="vehicle-display">
                        <div class="vehicle-image">
                            <img id="vehicleImage" src="images/phantom.png" alt="Vehicle">
                        </div>
                        <div class="vehicle-info">
                            <h3 id="vehicleName">Phantom Truck</h3>
                            <p id="vehicleDescription">Heavy-duty truck for long haul deliveries</p>
                            <div class="vehicle-tags">
                                <span class="tag" id="vehicleType">Trailer</span>
                                <span class="tag" id="vehicleDifficulty">Hard</span>
                                <span class="tag free">FREE</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Delivery Tab -->
            <div class="tab-content" id="deliveryContent">
                <div class="section-title">Active Delivery</div>
                <div class="delivery-info">
                    <div class="delivery-row">
                        <span class="label">Destination:</span>
                        <span class="value" id="deliveryDestination">—</span>
                    </div>
                    <div class="delivery-row">
                        <span class="label">Progress:</span>
                        <span class="value" id="deliveryProgress">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action buttons -->
        <div class="actions">
            <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
            <button class="btn btn-primary" id="actionBtn">Start Job</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
